databaseChangeLog:
  - changeSet:
      id: 005_create_products_table
      author: himsophearith44@gmail.com
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: products
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: product_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: image_path
                  type: VARCHAR(255)
              - column:
                  name: available_unit
                  type: INT
              - column:
                  name: models_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_products_models
                    references: models(models_id)
              - column:
                  name: color_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_products_colors
                    references: colors(color_id)
              - column:
                  name: sale_price
                  type: DECIMAL(19, 4)
        - addUniqueConstraint:
            tableName: products
            columnNames: models_id, color_id
            constraintName: uk_products_models_color
        - createTable:
            tableName: productImportHistories
            columns:
              - column:
                  name: productImportHistory_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: date_import
                  type: DATETIME
              - column:
                  name: unit_import
                  type: INT
              - column:
                  name: price_perunit
                  type: DECIMAL(19, 4)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_import_history_products
                    references: products(product_id)
